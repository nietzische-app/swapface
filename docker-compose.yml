name: swapface

services:
  web:
    container_name: swapface-web
    build: .
    ports:
      - "127.0.0.1:${SWAPFACE_PORT:-3010}:3000"
    environment:
      INSIGHTFACE_API_URL: ${INSIGHTFACE_API_URL:-}
      REACTOR_API_URL: ${REACTOR_API_URL:-}
    restart: unless-stopped
    networks:
      - swapface

networks:
  swapface:
    name: swapface
